<ion-menu menuId="main-menu" contentId="main-tabs" side="end">
  <ion-content>
    <ion-list>
      <ion-item routerLink="/settings" routerDirection="root" detail="false">
        <ion-icon name="settings-outline" slot="start" aria-hidden="true"></ion-icon>
        <ion-label>Settings</ion-label>
      </ion-item>
      <ion-item routerLink="/settings/homams" routerDirection="root" detail="false">
        <ion-icon name="flame-outline" slot="start" aria-hidden="true"></ion-icon>
        <ion-label>Homam catalog</ion-label>
      </ion-item>
      <ion-item routerLink="/settings/rituals" routerDirection="root" detail="false">
        <ion-icon name="flame-outline" slot="start" aria-hidden="true"></ion-icon>
        <ion-label>Rituals</ion-label>
      </ion-item>
      <ion-item routerLink="/settings/reminders" routerDirection="root" detail="false">
        <ion-icon name="alarm-outline" slot="start" aria-hidden="true"></ion-icon>
        <ion-label>Reminders</ion-label>
      </ion-item>
      <ion-item button detail="false" (click)="logout()">
        <ion-icon name="log-out-outline" slot="start" aria-hidden="true"></ion-icon>
        <ion-label>Log out</ion-label>
      </ion-item>
    </ion-list>
  </ion-content>
</ion-menu>
<ion-tabs id="main-tabs">
  <ion-tab-bar slot="bottom" aria-label="Main navigation">
    <ion-tab-button tab="dashboard" routerLink="/dashboard" routerLinkActive="tab-selected">
      <ion-icon name="home-outline" aria-hidden="true"></ion-icon>
      <ion-label>Home</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="bookings" routerLink="/bookings" routerLinkActive="tab-selected">
      <ion-icon name="calendar-number-outline" aria-hidden="true"></ion-icon>
      <ion-label>Bookings</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="schedule" routerLink="/schedule" routerLinkActive="tab-selected">
      <ion-icon name="calendar-outline" aria-hidden="true"></ion-icon>
      <ion-label>Schedule</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="devotees" routerLink="/devotees" routerLinkActive="tab-selected">
      <ion-icon name="people-outline" aria-hidden="true"></ion-icon>
      <ion-label>Devotees</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="history" routerLink="/history" routerLinkActive="tab-selected">
      <ion-icon name="time-outline" aria-hidden="true"></ion-icon>
      <ion-label>History</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
